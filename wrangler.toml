# 대부호 — Cloudflare Workers 무료 플랜 (바퀴벌레 포커와 같은 짜임)
# 화면 파일(public/)은 정적 자산으로 나간다. 소켓(/ws)만 Worker → Durable Object 하나(main)로 간다.
# 방은 전부 그 안 메모리에 산다. 무료 플랜은 SQLite 저장소 방식 DO 만 쓸 수 있다(new_sqlite_classes).
name = "daifugo"
main = "worker.js"
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true
preview_urls = false

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/ws", "/healthz"]

[[durable_objects.bindings]]
name = "GAME"
class_name = "DaifugoGame"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["DaifugoGame"]
